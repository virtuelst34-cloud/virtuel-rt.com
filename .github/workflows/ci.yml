name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel redundant PR runs; keep push runs (deploy concurrency is job-scoped below)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build
          path: dist/
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    # Deploy on push to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Serialize FTPS deploys (avoid Timeout / control socket)
    concurrency:
      group: hostinger-ftps-deploy
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}" >> .env

      - name: Validate environment variables
        run: node validate-env.js

      - name: Build project
        run: npm run build

      - name: Upload dist fallback artifact
        uses: actions/upload-artifact@v5
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Deploy to Hostinger via FTPS
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 180000
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/domains/virtuel-rt.com/public_html/' }}
          # Supprime les anciens chunks/index hashés absents du nouveau build
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Wait before FTPS retry 1
        if: steps.ftp_deploy.outcome == 'failure'
        run: |
          echo "::warning::FTPS attempt 1 failed (often Hostinger control-socket timeout). Waiting 30s before retry…"
          sleep 30

      - name: Retry Deploy to Hostinger via FTPS (2/3)
        id: ftp_deploy_retry
        if: steps.ftp_deploy.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 240000
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/domains/virtuel-rt.com/public_html/' }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Wait before FTPS retry 2
        if: steps.ftp_deploy.outcome == 'failure' && steps.ftp_deploy_retry.outcome == 'failure'
        run: |
          echo "::warning::FTPS attempt 2 failed. Waiting 45s before final retry…"
          sleep 45

      - name: Retry Deploy to Hostinger via FTPS (3/3)
        id: ftp_deploy_retry2
        if: steps.ftp_deploy.outcome == 'failure' && steps.ftp_deploy_retry.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 300000
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/domains/virtuel-rt.com/public_html/' }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: FTPS fallback notice
        if: >-
          steps.ftp_deploy.outcome == 'failure' &&
          steps.ftp_deploy_retry.outcome == 'failure' &&
          steps.ftp_deploy_retry2.outcome == 'failure'
        run: |
          echo "::error::Hostinger FTPS deploy failed after 3 attempts (Timeout / control socket)."
          echo ""
          echo "=== FALLBACK (do this now) ==="
          echo "1) Download Actions artifact: hostinger-dist-${GITHUB_SHA}"
          echo "   → unzip into public_html (index.html + assets/ at document root)"
          echo "2) OR rebuild via hPanel SOURCE zip:"
          echo "   python ./scripts/make-hostinger-source-zip.py"
          echo "   See HOSTINGER-ZIP.txt (Option A) for full steps."
          echo ""
          echo "Settings that usually work: protocol=ftps, port=21, security=loose,"
          echo "FTP_SERVER=Hostinger IP, FTP_SERVER_DIR=real www document root."
          exit 1
